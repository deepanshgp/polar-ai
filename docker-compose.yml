services:
  # ─── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: polarai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polarai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polarai_password}
      POSTGRES_DB: ${POSTGRES_DB:-polarai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polarai} -d ${POSTGRES_DB:-polarai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polarai_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-polarai}:${POSTGRES_PASSWORD:-polarai_password}@postgres:5432/${POSTGRES_DB:-polarai_db}
      DATA_MODE: ${DATA_MODE:-demo}
      DEMO_RANDOM_SEED: ${DEMO_RANDOM_SEED:-42}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-polar-ai-dev-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://frontend:3000}
      DEBUG: ${DEBUG:-true}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ─── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_APP_NAME: POLAR-AI
    container_name: polarai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: polarai_network
 
